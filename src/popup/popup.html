<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Chromesh</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <h1>Branches staging</h1>
        <span>
            <button type="button" id="refresh" title="Rafraîchir maintenant">⟳</button>
            <button type="button" id="options" title="Paramètres">⚙</button>
        </span>
    </header>
    <div id="filters" class="filters" hidden>
        <span class="search">
            <input type="search" id="search" placeholder="Projet ou branche…" autocomplete="off" aria-label="Filtrer par projet ou branche">
            <button type="button" id="clear" title="Effacer le filtre (Échap)" hidden>✕</button>
        </span>
        <span id="levels" class="levels"></span>
    </div>
    <ul id="list"></ul>
    <p id="no-match" hidden>Aucune branche ne correspond au filtre.</p>
    <p id="empty" hidden>
        Aucune donnée pour l'instant. Ouvre un projet sur
        <a href="https://www.odoo.sh/project" target="_blank" rel="noreferrer">odoo.sh</a>
        pour que l'extension lise les échéances.
    </p>
    <footer id="footer"></footer>
    <!-- parse.js et api.js ne sont pas chargés : le popup lit le cache, il ne
         scrape ni n'interroge l'API. -->
    <script src="../common/workdays.js"></script>
    <script src="../common/urgency.js"></script>
    <script src="../common/settings.js"></script>
    <script src="filter.js"></script>
    <script src="popup.js"></script>
</body>
</html>
